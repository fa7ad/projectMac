name: projectMac
options:
  bundleIdPrefix: com.projectmac
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    HEADER_SEARCH_PATHS: /usr/local/include
    LIBRARY_SEARCH_PATHS: /usr/local/lib
    OTHER_LDFLAGS:
      - -lprojectM-4
      - -lprojectM-4-playlist
      - -lc++
    SWIFT_OBJC_BRIDGING_HEADER: projectMac/Bridge/projectm-bridge.h
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES

targets:
  projectMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: projectMac
        excludes:
          - Resources/Presets/**
          - Resources/Textures/**
    postBuildScripts:
      - name: Sync Presets & Textures
        script: |
          set -euo pipefail
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$DEST/Presets" "$DEST/Textures"
          rsync -a --delete "${SRCROOT}/projectMac/Resources/Presets/" "$DEST/Presets/"
          rsync -a --delete "${SRCROOT}/projectMac/Resources/Textures/" "$DEST/Textures/"
        inputFiles:
          - $(SRCROOT)/projectMac/Resources/Presets
          - $(SRCROOT)/projectMac/Resources/Textures
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Presets
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Textures
    info:
      path: projectMac/Info.plist
      properties:
        NSAudioCaptureUsageDescription: projectMac captures audio output from a selected app to drive the visualizer.
        LSApplicationCategoryType: public.app-category.music
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: projectMac/projectMac.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectmac.app
        PRODUCT_NAME: projectMac
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - sdk: OpenGL.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
