name: Setup build
description: >
  Installs cmake/xcodegen/glm and builds libprojectM 4.x from source, cached by the
  upstream repo's current commit SHA.

runs:
  using: composite
  steps:
    - name: Install build tools
      shell: bash
      run: |
        export HOMEBREW_NO_AUTO_UPDATE=1
        brew install cmake xcodegen glm

    - name: Resolve libprojectM
      id: projectm
      shell: bash
      run: |
        echo "PREFIX=$HOME/libprojectm" >> "$GITHUB_ENV"
        echo "sha=$(git ls-remote https://github.com/projectM-visualizer/projectm.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

    - name: Cache libprojectM build
      id: cache-libprojectm
      uses: actions/cache@v6
      with:
        path: ~/libprojectm
        key: libprojectm-${{ runner.os }}-${{ steps.projectm.outputs.sha }}

    - name: Build libprojectM 4.x from source
      if: steps.cache-libprojectm.outputs.cache-hit != 'true'
      shell: bash
      run: ./scripts/deps.sh
