name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ./.github/actions/setup-build

      # Presets/textures are fetched fresh from upstream (see fetch-resources.sh) and are
      # not needed to verify the app compiles and links, so empty placeholders stand in
      # for them here instead of a full ~9,800-file fetch on every run.
      - name: Create placeholder preset/texture directories
        run: mkdir -p projectMac/Resources/Presets projectMac/Resources/Textures

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project projectMac.xcodeproj -scheme projectMac -configuration Debug build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
