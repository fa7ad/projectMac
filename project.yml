name: projectMac
options:
  bundleIdPrefix: com.projectmac
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    HEADER_SEARCH_PATHS: /usr/local/include
    LIBRARY_SEARCH_PATHS: /usr/local/lib
    OTHER_LDFLAGS: -lprojectM-4 -lprojectM-4-playlist -lc++
    SWIFT_OBJC_BRIDGING_HEADER: projectMac/Bridge/projectm-bridge.h
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic

targets:
  projectMac:
    type: application
    platform: macOS
    deploymentTarget: "14.2"
    sources:
      - path: projectMac
        excludes:
          - Resources/Presets/**
          - Resources/Textures/**
    postBuildScripts:
      - name: Sync Presets & Textures
        script: |
          set -euo pipefail
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$DEST/Presets" "$DEST/Textures"
          rsync -a --delete "${SRCROOT}/projectMac/Resources/Presets/" "$DEST/Presets/"
          rsync -a --delete "${SRCROOT}/projectMac/Resources/Textures/" "$DEST/Textures/"
        basedOnDependencyAnalysis: true
    info:
      path: projectMac/Info.plist
      properties:
        NSAudioCaptureUsageDescription: projectMac captures audio output from a selected app to drive the visualizer.
        LSApplicationCategoryType: public.app-category.music
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: projectMac/projectMac.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectmac.app
        PRODUCT_NAME: projectMac
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: OpenGL.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
