name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ./.github/actions/setup-build

      # Empty placeholders are enough to compile, and make ensure_resources skip the fetch.
      - name: Create placeholder preset/texture directories
        run: mkdir -p projectMac/Resources/Presets projectMac/Resources/Textures

      - name: Build
        run: ./scripts/build.sh --unsigned
